name: Android Release Build & CI

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Create temporary debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Verify Gradle Configuration
        run: |
          test -f gradlew
          test -f debug.keystore
          echo "Gradle wrapper: OK"
          echo "Temporary debug keystore: OK"

      - name: Assemble Release APK
        env:
          BAZAAR_PUBLIC_KEY: ${{ secrets.BAZAAR_PUBLIC_KEY }}
          TAPSELL_KEY: ${{ secrets.TAPSELL_KEY }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Bundle Release AAB
        env:
          BAZAAR_PUBLIC_KEY: ${{ secrets.BAZAAR_PUBLIC_KEY }}
          TAPSELL_KEY: ${{ secrets.TAPSELL_KEY }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Verify Release Artifacts
        run: |
          test -n "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"
          echo "Release APK and AAB were generated successfully."

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: arena-clash-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: arena-clash-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
