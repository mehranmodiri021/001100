name: Android Release Build & CI

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      # ═══════════════════════════════════════════════════════════════
      # مرحله ۱: ساخت فایل local.properties از GitHub Secrets
      # ═══════════════════════════════════════════════════════════════
      # این مرحله کلیدهای حساس (تپسل و کافه‌بازار) رو از GitHub Secrets
      # می‌خونه و تو فایل local.properties می‌ریزه تا پلاگین secrets
      # بتونه ازشون استفاده کنه و در BuildConfig قرار بگیرن.
      - name: Create local.properties from secrets
        run: |
          echo "TAPSELL_KEY=${{ secrets.TAPSELL_KEY }}" > local.properties
          echo "BAZAAR_PUBLIC_KEY=${{ secrets.BAZAAR_PUBLIC_KEY }}" >> local.properties
          echo "local.properties created:"
          wc -l local.properties

      # ═══════════════════════════════════════════════════════════════
      # مرحله ۲: اعتبارسنجی Secrets امضا
      # ═══════════════════════════════════════════════════════════════
      - name: Validate Release Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          test -n "$KEYSTORE_BASE64" || { echo "::error::KEYSTORE_BASE64 missing"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::STORE_PASSWORD missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::KEY_ALIAS missing"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::KEY_PASSWORD missing"; exit 1; }
          echo "Release signing secrets are configured."

      # ═══════════════════════════════════════════════════════════════
      # مرحله ۳: اجرای تست‌های واحد
      # ═══════════════════════════════════════════════════════════════
      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      # ═══════════════════════════════════════════════════════════════
      # مرحله ۴: بازسازی فایل Keystore از Base64
      # ═══════════════════════════════════════════════════════════════
      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e
          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks
          test -s release-keystore.jks
          echo "Release keystore restored successfully."

      # ═══════════════════════════════════════════════════════════════
      # مرحله ۵: ساخت APK امضاشده
      # ═══════════════════════════════════════════════════════════════
      - name: Assemble Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      # ═══════════════════════════════════════════════════════════════
      # مرحله ۶: ساخت AAB (برای Google Play، اختیاری)
      # ═══════════════════════════════════════════════════════════════
      - name: Bundle Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease --stacktrace

      # ═══════════════════════════════════════════════════════════════
      # مرحله ۷: آپلود APK
      # ═══════════════════════════════════════════════════════════════
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: arena-clash-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ═══════════════════════════════════════════════════════════════
      # مرحله ۸: آپلود AAB
      # ═══════════════════════════════════════════════════════════════
      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: arena-clash-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # ═══════════════════════════════════════════════════════════════
      # مرحله ۹: پاکسازی فایل‌های حساس
      # ═══════════════════════════════════════════════════════════════
      - name: Cleanup Sensitive Files
        if: always()
        run: |
          rm -f release-keystore.jks
          rm -f local.properties
