name: Android Release Build & CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew || true

      - name: Assemble Release APK
        env:
          BAZAAR_PUBLIC_KEY: ${{ secrets.BAZAAR_PUBLIC_KEY }}
          TAPSELL_KEY: ${{ secrets.TAPSELL_KEY }}
        run: gradle :app:assembleRelease --stacktrace

      - name: Bundle Release AAB
        env:
          BAZAAR_PUBLIC_KEY: ${{ secrets.BAZAAR_PUBLIC_KEY }}
          TAPSELL_KEY: ${{ secrets.TAPSELL_KEY }}
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: arena-clash-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Release Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: arena-clash-release-aab
          path: app/build/outputs/bundle/release/*.aab
