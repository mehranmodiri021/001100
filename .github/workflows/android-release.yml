name: Android Release Build & CI

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Validate Release Signing Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64" || {
            echo "::error::KEYSTORE_BASE64 GitHub Secret is missing."
            exit 1
          }

          test -n "$STORE_PASSWORD" || {
            echo "::error::STORE_PASSWORD GitHub Secret is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "::error::KEY_ALIAS GitHub Secret is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "::error::KEY_PASSWORD GitHub Secret is missing."
            exit 1
          }

          echo "Release signing secrets are configured."

      - name: Restore Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -e

          echo "$KEYSTORE_BASE64" | base64 --decode > release-keystore.jks

          test -s release-keystore.jks

          echo "Release keystore restored successfully."

      - name: Assemble Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BAZAAR_PUBLIC_KEY: ${{ secrets.BAZAAR_PUBLIC_KEY }}
          TAPSELL_KEY: ${{ secrets.TAPSELL_KEY }}
        run: |
          ./gradlew :app:assembleRelease --stacktrace

      - name: Bundle Release AAB
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          BAZAAR_PUBLIC_KEY: ${{ secrets.BAZAAR_PUBLIC_KEY }}
          TAPSELL_KEY: ${{ secrets.TAPSELL_KEY }}
        run: |
          ./gradlew :app:bundleRelease --stacktrace

      - name: Verify Release APK
        run: |
          set -e

          APK=$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"

          echo "Release APK:"
          echo "$APK"

          ls -lh "$APK"

      - name: Verify Release AAB
        run: |
          set -e

          AAB=$(find app/build/outputs/bundle/release \
            -maxdepth 1 \
            -type f \
            -name "*.aab" \
            -print -quit)

          test -n "$AAB"

          echo "Release AAB:"
          echo "$AAB"

          ls -lh "$AAB"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: arena-clash-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: arena-clash-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Cleanup Release Keystore
        if: always()
        run: |
          rm -f release-keystore.jks
